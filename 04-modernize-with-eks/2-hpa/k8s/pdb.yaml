---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
